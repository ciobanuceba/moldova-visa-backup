[build]
  base = "."
  command = "pnpm --filter @workspace/moldova-visa-assist run build"
  publish = "artifacts/moldova-visa-assist/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  NPM_FLAGS = "--include=dev"

[dev]
  command = "pnpm --filter @workspace/moldova-visa-assist run dev"
  port = 5000

# SPA fallback for the Vite/React application.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
