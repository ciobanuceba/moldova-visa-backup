[build]
  base = "moldova-visa"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/next"

# Do not add a catch-all /index.html redirect: Next.js routing is handled by the Netlify Next.js runtime.
